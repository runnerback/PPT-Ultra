name: privacy

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  public-data-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check public file content
        run: |
          python tools/privacy-check.py
          python tools/test_privacy.py
      - name: Install pinned Gitleaks with SHA-256 verification
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan reachable Git history without printing secret values
        run: '"$RUNNER_TEMP/gitleaks" git . --config .gitleaks.toml --log-opts="--all" --redact=100 --no-banner'
