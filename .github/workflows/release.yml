# 推 tag 自动发 Release（2026-11-02）：
#   git tag 1.3.0 && git push origin 1.3.0  →  smoke 通过 → 打包 skills/ppt-ultra → 读 docs/releases/1.3.0.md 当正文 → 建 Release 并标 Latest
# 发布前置（和手动一样，见 docs/RELEASING.md）：三处版本串一致、NOTICE 有条目、docs/releases/<版本>.md 已写好并随 tag 一起在仓库里。
# smoke 不过或版本串不一致就不会建 Release；修复需新提交、新版本 tag，网络等瞬时故障可重跑同一 tag。
# 推法：先 git push origin main，再单独 git push origin <tag>——分支和 tag 混在一次 push 里时 GitHub 可能不触发 tag 事件（2026-11-02 1.4.0 实测 0 次运行）。
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（已推送到仓库，如 1.2.1）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # 自动和手动触发均检出该 tag，确保源码、清单与 Release 对应同一个提交。
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.VERSION }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装哈希锁定依赖
        run: |
          python -m pip install --require-hashes --only-binary=:all: --index-url https://pypi.org/simple -r skills/ppt-ultra/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz zip >/dev/null

      - name: 安全回归与 Node 锁文件安装
        run: |
          python tools/test_security.py
          npm ci --prefix skills/ppt-ultra/engines/html-themed/project --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: smoke
        run: PYTHON=python bash tools/smoke.sh

      - name: 打包并核对版本串
        run: bash tools/package-release.sh "$VERSION"

      - name: 校验恢复后的技能
        run: python tools/test_upload_package.py --zip "dist/ppt-ultra-$VERSION-upload.zip" --smoke

      - name: 从 docs/releases/<版本>.md 取标题与正文
        run: |
          NOTES="docs/releases/$VERSION.md"
          TITLE="$(head -n 1 "$NOTES" | sed -E 's/^#+[[:space:]]*//; s/[[:space:]]+$//')"
          tail -n +2 "$NOTES" | sed '1{/^$/d;}' > dist/body.md
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "标题：$TITLE"; echo "正文 $(wc -c < dist/body.md) 字节"

      - name: 建（或更新）Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在：更新正文与附件"
            gh release edit "$VERSION" --title "$TITLE" --notes-file dist/body.md --latest
            gh release upload "$VERSION" "dist/ppt-ultra-$VERSION.zip" "dist/ppt-ultra-$VERSION-upload.zip" "dist/ppt-ultra-$VERSION-source-"*.zip "dist/ppt-ultra-$VERSION-source-manifest.json" dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" "dist/ppt-ultra-$VERSION.zip" "dist/ppt-ultra-$VERSION-upload.zip" "dist/ppt-ultra-$VERSION-source-"*.zip "dist/ppt-ultra-$VERSION-source-manifest.json" dist/SHA256SUMS \
              --title "$TITLE" --notes-file dist/body.md --latest --verify-tag
          fi
          gh release view "$VERSION" --json tagName,name,isDraft,isPrerelease,assets \
            --jq '"\(.tagName) | \(.name) | draft=\(.isDraft) pre=\(.isPrerelease) | assets: \([.assets[].name] | join(", "))"'
