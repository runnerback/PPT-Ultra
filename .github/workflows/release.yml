# 推 tag 自动发 Release（2026-11-02）：
#   git tag 1.3.0 && git push origin 1.3.0  →  smoke 通过 → 打包 skills/ppt-ultra → 读 docs/releases/1.3.0.md 当正文 → 建 Release 并标 Latest
# 发布前置（和手动一样，见 docs/RELEASING.md）：三处版本串一致、NOTICE 有条目、docs/releases/<版本>.md 已写好并随 tag 一起在仓库里。
# smoke 不过或版本串不一致就不会建 Release；修好后删掉 tag 重推，或在 Actions 页用 workflow_dispatch 填 tag 重跑（按所选分支的树打包）。
# 推法：先 git push origin main，再单独 git push origin <tag>——分支和 tag 混在一次 push 里时 GitHub 可能不触发 tag 事件（2026-11-02 1.4.0 实测 0 次运行）。
name: release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（已推送到仓库，如 1.2.0）"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # tag 推送：检出那个 tag；手动触发：检出点「Run workflow」时选的分支（通常 main，发布说明与版本串在这里），tag 只要求已存在
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 smoke 依赖（Spec Native 与宿主契约只要 python-pptx / Pillow，流程图版式要 graphviz）
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet "python-pptx>=0.6.21" "Pillow>=9.0.0" "PyYAML>=6.0"
          sudo apt-get update -qq && sudo apt-get install -y -qq graphviz zip >/dev/null

      - name: smoke
        run: PYTHON=python bash tools/smoke.sh

      - name: 打包并核对版本串
        run: bash tools/package-release.sh "$VERSION"

      - name: 从 docs/releases/<版本>.md 取标题与正文
        run: |
          NOTES="docs/releases/$VERSION.md"
          TITLE="$(head -n 1 "$NOTES" | sed -E 's/^#+[[:space:]]*//; s/[[:space:]]+$//')"
          tail -n +2 "$NOTES" | sed '1{/^$/d;}' > dist/body.md
          echo "TITLE=$TITLE" >> "$GITHUB_ENV"
          echo "标题：$TITLE"; echo "正文 $(wc -c < dist/body.md) 字节"

      - name: 建（或更新）Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在：更新正文与附件"
            gh release edit "$VERSION" --title "$TITLE" --notes-file dist/body.md --latest
            gh release upload "$VERSION" "dist/ppt-ultra-$VERSION.zip" dist/SHA256SUMS --clobber
          else
            gh release create "$VERSION" "dist/ppt-ultra-$VERSION.zip" dist/SHA256SUMS \
              --title "$TITLE" --notes-file dist/body.md --latest --verify-tag
          fi
          gh release view "$VERSION" --json tagName,name,isLatest,isDraft,isPrerelease,assets \
            --jq '"\(.tagName) | \(.name) | latest=\(.isLatest) draft=\(.isDraft) pre=\(.isPrerelease) | assets: \([.assets[].name] | join(", "))"'
